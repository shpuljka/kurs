# Builds a signed release APK and publishes it as a GitHub Release.
# Start it by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build signed APK
        env:
          KURS_KEYSTORE_BASE64: ${{ secrets.KURS_KEYSTORE_BASE64 }}
          KURS_KEYSTORE_PASSWORD: ${{ secrets.KURS_KEYSTORE_PASSWORD }}
          KURS_KEY_ALIAS: ${{ secrets.KURS_KEY_ALIAS }}
          KURS_KEY_PASSWORD: ${{ secrets.KURS_KEY_PASSWORD }}
        run: |
          if [ -z "$KURS_KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are not set"; exit 1; fi
          export KURS_KEYSTORE_FILE="$RUNNER_TEMP/kurs-release.jks"
          echo "$KURS_KEYSTORE_BASE64" | base64 --decode > "$KURS_KEYSTORE_FILE"
          ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "Kurs-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Kurs-$GITHUB_REF_NAME.apk" --title "Kurs $GITHUB_REF_NAME" --generate-notes
